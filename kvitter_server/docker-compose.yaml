services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kvitter
      POSTGRES_PASSWORD: "QklY6IMvoNBNjdweHk2W-_d8NEh-yvQU"
    volumes:
      - kvitter_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Kvw8_NU0LKXP4bGI9RohP9my8hq8Hgqr"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kvitter_test
      POSTGRES_PASSWORD: "K4O-ICpQaN668g1Fdl5zH2w3LXrHbV3Z"
    volumes:
      - kvitter_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "4hHxZgauX2FnnRyhsBOPMTEsqx8Y0pL9"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  kvitter_data:
  kvitter_test_data:
